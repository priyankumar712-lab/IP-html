<!DOCTYPE html>
<html lang="en">
<head>
    <title>HTML Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .question-block {
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .radio-option {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }
        .radio-option input {
            margin-right: 10px;
        }
        input[type="submit"], .btn-retry {
            display: block;
            width: 100%;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }
        input[type="submit"]:hover, .btn-retry:hover {
            background-color: #388E3C;
        }
        .error-message {
            color: #d9534f;
            background-color: #f2dede;
            padding: 10px;
            border: 1px solid #ebccd1;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
    
        #resultsSection {
            display: none;
        }
        .score-text {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .reward-container {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #fffde7, #fff9c4);
            border: 2px dashed #fbc02d;
            border-radius: 8px;
            margin-bottom: 25px;
            animation: popIn 0.5s ease-out;
        }
        .reward-badge {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .reward-title {
            font-size: 18px;
            font-weight: bold;
            color: #f57f17;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .reward-desc {
            font-size: 14px;
            color: #5d4037;
            margin-top: 5px;
        }
        .review-block {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            border-left: 4px solid #ccc;
        }
        .correct-review {
            background-color: #e8f5e9;
            border-left-color: #4CAF50;
        }
        .incorrect-review {
            background-color: #ffebee;
            border-left-color: #f44336;
        }
        .review-q-text {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .review-details {
            font-size: 14px;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
            top: -10px;
            z-index: 10;
            border-radius: 50%;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(600px) rotate(360deg);
            }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container" id="quizContainer">
        <!-- QUIZ PAGE -->
        <div id="quizSection">
            <h1>HTML Knowledge Quiz</h1>
            <div id="errorBox" class="error-message">Please enter your name and answer all questions before submitting.</div>
            
            <form id="quizForm">
                <!-- Name Input Field -->
                <div class="form-group">
                    <label for="username">Name:</label>
                    <input type="text" id="username">
                </div>

                <!-- Q1 -->
                <div class="question-block">
                    <div class="question-text">1. Which tag is used to add an image?</div>
                    <div class="radio-option">
                        <input type="radio" id="q1a" name="q1" value="img-tag">
                        <label for="q1a">img-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q1b" name="q1" value="a-tag">
                        <label for="q1b">a-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q1c" name="q1" value="href-tag">
                        <label for="q1c">href-tag</label>
                    </div>
                </div>

                <!-- Q2 -->
                <div class="question-block">
                    <div class="question-text">2. Which tag is used to add a link?</div>
                    <div class="radio-option">
                        <input type="radio" id="q2a" name="q2" value="a-tag">
                        <label for="q2a">a-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q2b" name="q2" value="img-tag">
                        <label for="q2b">img-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q2c" name="q2" value="href-tag">
                        <label for="q2c">href-tag</label>
                    </div>
                </div>

                <!-- Q3 -->
                <div class="question-block">
                    <div class="question-text">3. Which tag is used to add a table?</div>
                    <div class="radio-option">
                        <input type="radio" id="q3a" name="q3" value="table">
                        <label for="q3a">table</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q3b" name="q3" value="img-tag">
                        <label for="q3b">img-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q3c" name="q3" value="href-tag">
                        <label for="q3c">href-tag</label>
                    </div>
                </div>

                <!-- Q4 -->
                <div class="question-block">
                    <div class="question-text">4. Which tag is used to add font style?</div>
                    <div class="radio-option">
                        <input type="radio" id="q4a" name="q4" value="h1">
                        <label for="q4a">h1</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q4b" name="q4" value="img-tag">
                        <label for="q4b">img-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q4c" name="q4" value="href-tag">
                        <label for="q4c">href-tag</label>
                    </div>
                </div>

                <!-- Q5 -->
                <div class="question-block">
                    <div class="question-text">5. Which tag is used to add colour?</div>
                    <div class="radio-option">
                        <input type="radio" id="q5a" name="q5" value="h1">
                        <label for="q5a">h1</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q5b" name="q5" value="img-tag">
                        <label for="q5b">img-tag</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="q5c" name="q5" value="background">
                        <label for="q5c">background</label>
                    </div>
                </div>

                <input type="submit" value="Submit Quiz">
            </form>
        </div>

        <!-- RESULTS PAGE -->
        <div id="resultsSection">
            <h1>Quiz Results</h1>
            <div id="scoreContainer" class="score-text"></div>
            
            <!-- Reward Container Box -->
            <div id="rewardBox" class="reward-container"></div>
            
            <div id="reviewContainer"></div>
            <button class="btn-retry" onclick="resetQuiz()">Try Again</button>
        </div>
    </div>

    <script>
        const correctAnswers = {
            q1: "img-tag",
            q2: "a-tag",
            q3: "table",
            q4: "h1",
            q5: "background"
        };

        const questionTexts = {
            q1: "1. Which tag is used to add an image?",
            q2: "2. Which tag is used to add a link?",
            q3: "3. Which tag is used to add a table?",
            q4: "4. Which tag is used to add font style?",
            q5: "5. Which tag is used to add colour?"
        };

        const quizForm = document.getElementById('quizForm');
        const errorBox = document.getElementById('errorBox');
        const quizSection = document.getElementById('quizSection');
        const resultsSection = document.getElementById('resultsSection');

        quizForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            let allAnswered = true;
            const userAnswers = {};

            for (let i = 1; i <= 5; i++) {
                const selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selectedOption) {
                    allAnswered = false;
                    break;
                }
                userAnswers[`q${i}`] = selectedOption.value;
            }

            if (!username || !allAnswered) {
                errorBox.style.display = 'block';
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            errorBox.style.display = 'none';

            let score = 0;
            const totalQuestions = 5;
            let reviewHTML = '';

            for (let i = 1; i <= 5; i++) {
                const qKey = `q${i}`;
                const userAns = userAnswers[qKey];
                const correctAns = correctAnswers[qKey];
                const isCorrect = userAns === correctAns;

                if (isCorrect) score++;

                reviewHTML += `
                    <div class="review-block ${isCorrect ? 'correct-review' : 'incorrect-review'}">
                        <div class="review-q-text">${questionTexts[qKey]}</div>
                        <div class="review-details">
                            Your answer: <strong>${userAns}</strong> ${isCorrect ? '✅' : '❌'}<br>
                            ${!isCorrect ? `Correct answer: <strong>${correctAns}</strong>` : ''}
                        </div>
                    </div>
                `;
            }

            document.getElementById('scoreContainer').innerHTML = 
                `Hello, <strong>${username}</strong>!<br>Your Score: ${score} / ${totalQuestions} (${(score / totalQuestions) * 100}%)`;

            let badge = '🏆';
            let title = 'HTML Master!';
            let desc = 'Outstanding performance! You know your HTML well.';

            if (score === 5) {
                badge = '🏆';
                title = 'HTML Grandmaster';
                desc = 'Perfect score! You answered every question correctly!';
                triggerConfetti();
            } else if (score >= 3) {
                badge = '🥇';
                title = 'HTML Scholar';
                desc = 'Great effort! You have a strong grasp of HTML basics.';
            } else {
                badge = '📚';
                title = 'HTML Novice';
                desc = 'Keep practicing! Review the correct answers below and try again.';
            }

            document.getElementById('rewardBox').innerHTML = `
                <div class="reward-badge">${badge}</div>
                <div class="reward-title">${title}</div>
                <div class="reward-desc">${desc}</div>
            `;

            document.getElementById('reviewContainer').innerHTML = reviewHTML;

            quizSection.style.display = 'none';
            resultsSection.style.display = 'block';
        });

        function resetQuiz() {
            quizForm.reset();
            errorBox.style.display = 'none';
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            resultsSection.style.display = 'none';
            quizSection.style.display = 'block';
        }

        function triggerConfetti() {
            const container = document.getElementById('quizContainer');
            const colors = ['#4CAF50', '#f44336', '#2196F3', '#FFEB3B', '#9C27B0', '#FF9800'];
            
            for (let i = 0; i < 35; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 1) + 's';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
