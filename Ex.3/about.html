<!DOCTYPE html>
<html>
<head>
    <title>About Us</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            padding: 25px;
            border: 3px solid #333;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        p {
            border: 2px solid #4CAF50;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f9fff9;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: 2px solid #388E3C;
            border-radius: 5px;
            margin-top: 10px;
        }

        a:hover {
            background-color: #388E3C;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>About ShopEasy</h1>

        <p>
            Welcome to ShopEasy. We provide electronics,
            fashion products, and accessories at affordable prices.
        </p>

        <a href="products.html">View Products</a>
    </div>

</body>
</html>
