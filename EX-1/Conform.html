<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Booking</title>
    <style>
        body {
            background-color: #f4ecf1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2b7a4b;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .rating-box {
            margin-bottom: 25px;
        }
        .stars {
            font-size: 30px;
            color: #cccccc;
            cursor: pointer;
            direction: rtl;
            unicode-bidi: bidi-override;
            display: inline-block;
        }
        .stars input {
            display: none;
        }
        .stars label {
            display: inline-block;
            padding: 0 2px;
            transition: color 0.2s;
        }
        .stars label:hover,
        .stars label:hover ~ label,
        .stars input:checked ~ label {
            color: #ffcc00;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 20px;
        }
        button {
            background-color: #8c52ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #703be3;
        }
        .home-link {
            display: inline-block;
            margin-top: 25px;
            color: #8c52ff;
            text-decoration: none;
            font-weight: 600;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Booking Confirmed!</h1>
        <p>Thanks for visiting us 😍</p>

        <form action="#" method="POST">
            <div class="rating-box">
                <label style="font-weight: 600; display: block; margin-bottom: 8px;">Rate your experience:</label>
                <div class="stars">
                    <input type="radio" id="star5" name="rating" value="5"><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                </div>
            </div>

            <textarea placeholder="Leave your feedback here..."></textarea>
            
            <button type="submit">Submit Review</button>
        </form>

        <a href="A-Z.html" class="home-link">Back to Home Page</a>
    </div>

</body>
</html>
