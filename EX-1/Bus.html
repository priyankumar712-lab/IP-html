<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Booking</title>

    <style>
        body {
            background-color: #f8f0f5;
            font-family: Arial, sans-serif;
            color: #333;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: darkred;
            font-weight: bold;
        }

        table {
            width: 70%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        .booking-table {
            width: 50%;
            margin: 20px auto;
            background-color: white;
        }

        .booking-table td {
            padding: 10px;
        }

        input, select {
            padding: 5px;
            width: 90%;
        }
    </style>
</head>

<body>

<h1>Bus Ticket Booking</h1>

<p>Best offers on first bus ticket booking</p>

<h2 style="color:darkred;">Available Buses</h2>

<table>
    <tr>
        <th>Bus Name</th>
        <th>Departure Time</th>
        <th>Price</th>
        <th>Status</th>
    </tr>

    <tr>
        <td>Zing Bus</td>
        <td>09:00 AM</td>
        <td>₹250</td>
        <td>Available</td>
    </tr>

    <tr>
        <td>City1 Bus</td>
        <td>02:30 PM</td>
        <td>₹150</td>
        <td>Available</td>
    </tr>
</table>

<h2 style="color:darkred;">Book Your Ticket</h2>

<form action="#" method="POST">
    <table class="booking-table">
        <tr>
            <td>Passenger Name</td>
            <td><input type="text" name="name" required></td>
        </tr>

        <tr>
            <td>Select Bus</td>
            <td>
                <select name="bus" required>
                    <option>--Select Bus--</option>
                    <option>Zing Bus</option>
                    <option>City1 Bus</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Travel Date</td>
            <td><input type="date" name="date" required></td>
        </tr>

        <tr>
            <td>Number of Tickets</td>
            <td><input type="number" name="tickets" min="1" max="10" required></td>
        </tr>

        <tr>
            <td colspan="2">
                <button type="submit">Book Ticket</button>
            </td>
        </tr>
    </table>
</form>

<br>

<a href="A-Z.html">Home Page</a>

</body>
</html>
